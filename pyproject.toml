[project]
name = "project-templates"
version = "0.1.0"
description = "Copier project templates with full toolchains and Claude Code settings"
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = ["copier>=9.4", "pytest>=9", "pyyaml>=6"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers"]
markers = ["slow: generates a project and runs its recipes (builds Rust and C++)"]
