# Run by prek (or pre-commit) on `git commit`; the hooks reuse the just recipes
# so commits, CI and Claude all apply exactly the same rules.
repos:
  - repo: local
    hooks:
      - id: fmt-check
        name: just fmt-check
        entry: just fmt-check
        language: system
        pass_filenames: false
      - id: lint
        name: just lint
        entry: just lint
        language: system
        pass_filenames: false
