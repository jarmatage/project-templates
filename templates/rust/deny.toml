# cargo-deny configuration; run with `just deny` after changing dependencies.
[graph]
all-features = true

[advisories]
version = 2

[licenses]
version = 2
# The allowlist covers common permissive licenses, not only ones in use today.
unused-allowed-license = "allow"
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "MIT",
    "Unicode-3.0",
    "Zlib",
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
# Path dependencies between unpublished workspace crates carry no version.
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
